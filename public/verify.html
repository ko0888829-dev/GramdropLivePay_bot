<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Verification</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 28px;
      border-radius: 16px;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .spinner {
      border: 4px solid #334155;
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h2 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #94a3b8; margin: 0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="loader"></div>
    <h2 id="title">🛡️ Checking Your Device...</h2>
    <p id="desc">Please wait while we verify your phone & network.</p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ဖုန်း Hardware / Browser အချက်အလက်များမှ Unique Device ID ထုတ်ယူခြင်း
    function getDeviceFingerprint() {
      const raw = [
        navigator.userAgent,
        navigator.platform,
        navigator.language,
        screen.width + "x" + screen.height + "x" + screen.colorDepth,
        navigator.hardwareConcurrency || "0",
        navigator.deviceMemory || "0",
        Intl.DateTimeFormat().resolvedOptions().timeZone
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }
      return "DEV_" + Math.abs(hash);
    }

    async function verifyDevice() {
      const user = tg.initDataUnsafe?.user;
      if (!user) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("title").innerText = "❌ Open inside Telegram";
        document.getElementById("desc").innerText = "Please open this verification from the bot.";
        return;
      }

      const deviceId = getDeviceFingerprint();

      try {
        const res = await fetch("/api/webhook", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            device_verify: true,
            user_id: String(user.id),
            first_name: user.first_name || "User",
            device_id: deviceId
          })
        });

        const data = await res.json();
        document.getElementById("loader").style.display = "none";

        if (data.status === "ok") {
          document.getElementById("title").innerText = "✅ Device Verified!";
          document.getElementById("desc").innerText = "Returning to bot...";
          setTimeout(() => tg.close(), 1200);
        } else {
          document.getElementById("title").innerText = "🚫 Multiple Accounts Blocked!";
          document.getElementById("desc").innerText = data.message || "This phone is already registered with another account.";
        }
      } catch (e) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("title").innerText = "⚠️ Network Error";
        document.getElementById("desc").innerText = "Please try again.";
      }
    }

    setTimeout(verifyDevice, 1000);
  </script>
</body>
</html>
